<!DOCTYPE html>
<html>
<head>
    <title>Neon Counter App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <p class="tag">✦INTERACTIVE STUDIO ✦</p>

        <h1>MY COUNTER APP</h1>
        <p class="subtitle">Control your numbers.</p>

        <div class="counter-box">
            <p>CURRENT COUNT</p>
            <h2 id="count">0</h2>
            <span id="status">● ZERO STATE</span>
        </div>

        <div class="buttons">
            <button id="increase" class="plus">+ INCREASE</button>
            <button id="decrease" class="minus">− DECREASE</button>
        </div>

        <button id="addFive">+5 QUICK ADD</button>

        <button id="reset">↻ RESET</button>

        <p class="footer">
            POWERED BY • HTML • CSS • JAVASCRIPT
        </p>

    </div>

    <script src="script.js"></script>
</body>
</html>
